apiVersion: apps/v1
kind: Deployment
metadata:
  name: techstyle-app
  namespace: default
  labels:
    app: techstyle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techstyle
  template:
    metadata:
      labels:
        app: techstyle
    spec:
      containers:
      - name: techstyle-web
        image: techstyle:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        env:
        - name: PORT
          value: "5001"
        - name: DATABASE_URL
          value: "sqlite:///techstyle.db"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/products
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/products
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: techstyle-service
  namespace: default
  labels:
    app: techstyle
spec:
  type: NodePort
  selector:
    app: techstyle
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30001
