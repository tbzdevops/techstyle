apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: techstyle-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tbzdevops/techstyle.git
    targetRevision: day_18_solution
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
