---
# ==============================================================================
# Ansible Playbook: TechStyle Kubernetes Cluster & ArgoCD Setup
# ==============================================================================

- name: Step 1 - Common Node Setup (Master & Workers)
  hosts: role_master:role_worker:all
  become: yes
  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Ensure containerd service is installed
      ansible.builtin.apt:
        name: containerd
        state: present

    - name: Ensure containerd is started and enabled
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: yes

    - name: Install Kubernetes tools (kubelet, kubeadm, kubectl)
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Hold Kubernetes packages at current version
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

- name: Step 2 - Initialize Control Plane on Master & Setup ArgoCD
  hosts: role_master
  become: yes
  tasks:
    - name: Initialize Kubernetes Control Plane with kubeadm
      ansible.builtin.command:
        cmd: kubeadm init --pod-network-cidr=10.244.0.0/16
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init

    - name: Setup kubeconfig directory for ubuntu user
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy admin.conf to ubuntu kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Generate join command token for worker nodes
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: join_command_output

    - name: Set join command fact
      ansible.builtin.set_fact:
        join_command: "{{ join_command_output.stdout }}"

    - name: Install ArgoCD Namespace
      ansible.builtin.command:
        cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf create namespace argocd
      failed_when: false

    - name: Install ArgoCD Components
      ansible.builtin.command:
        cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      failed_when: false

- name: Step 3 - Join Worker Nodes to Cluster
  hosts: role_worker
  become: yes
  tasks:
    - name: Join worker node to Kubernetes cluster
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['role_master'][0]]['join_command'] }}"
        creates: /etc/kubernetes/kubelet.conf
