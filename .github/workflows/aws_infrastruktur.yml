name: AWS Infrastruktur bereitstellen

on:
  push:
    branches:
      - day_8_solution
    paths:
      - ".github/workflows/aws_infrastruktur.yml"
      - "infrastruktur/**"
  workflow_dispatch:
    inputs:
      action:
        description: "OpenTofu Aktion"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

jobs:
  tofu:
    name: OpenTofu ${{ github.event_name == 'push' && 'apply' || inputs.action }}
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_student_name: gha-${{ github.run_number }}
      TOFU_STATE_BUCKET: ${{ vars.TOFU_STATE_BUCKET }}
      TOFU_STATE_KEY: techstyle/day_8_solution/infrastruktur.tfstate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.0"

      - name: Ensure OpenTofu state bucket exists
        run: |
          test -n "$TOFU_STATE_BUCKET" || (echo "Missing GitHub variable TOFU_STATE_BUCKET" && exit 1)

          if aws s3api head-bucket --bucket "$TOFU_STATE_BUCKET" 2>/dev/null; then
            echo "State bucket already exists: $TOFU_STATE_BUCKET"
            exit 0
          fi

          if [ "${{ vars.AWS_REGION || 'us-east-1' }}" = "us-east-1" ]; then
            aws s3api create-bucket --bucket "$TOFU_STATE_BUCKET"
          else
            aws s3api create-bucket \
              --bucket "$TOFU_STATE_BUCKET" \
              --create-bucket-configuration LocationConstraint=${{ vars.AWS_REGION || 'us-east-1' }}
          fi

          aws s3api put-bucket-versioning \
            --bucket "$TOFU_STATE_BUCKET" \
            --versioning-configuration Status=Enabled

      - name: Prepare SSH public key for cloud-init
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_SSH_KEY" || (echo "Missing GitHub secret EC2_SSH_KEY" && exit 1)
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keygen -y -f ~/.ssh/ec2_key > /tmp/techstyle_ec2.pub

      - name: OpenTofu init
        working-directory: infrastruktur
        run: |
          tofu init \
            -backend-config="bucket=$TOFU_STATE_BUCKET" \
            -backend-config="key=$TOFU_STATE_KEY" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="encrypt=true"

      - name: OpenTofu validate
        working-directory: infrastruktur
        run: tofu validate

      - name: OpenTofu plan
        if: ${{ github.event_name == 'push' || inputs.action == 'apply' }}
        working-directory: infrastruktur
        run: |
          tofu plan \
            -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -var="ssh_public_key_path=/tmp/techstyle_ec2.pub"

      - name: OpenTofu apply
        if: ${{ github.event_name == 'push' || inputs.action == 'apply' }}
        working-directory: infrastruktur
        run: |
          tofu apply -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -var="ssh_public_key_path=/tmp/techstyle_ec2.pub"

      - name: OpenTofu destroy plan
        if: ${{ inputs.action == 'destroy' }}
        working-directory: infrastruktur
        run: |
          tofu plan -destroy \
            -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -var="ssh_public_key_path=/tmp/techstyle_ec2.pub"

      - name: OpenTofu destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: infrastruktur
        run: |
          tofu destroy -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -var="ssh_public_key_path=/tmp/techstyle_ec2.pub"
