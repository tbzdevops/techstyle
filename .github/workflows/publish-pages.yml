name: Publish to PyPI Index on GitHub Pages

# Extended artifact flow (Tag 06 - Auftrag 2): publish a tagged build of
# TechStyle to a self-hosted PEP 503 index on GitHub Pages, so it becomes
# a versioned, reproducible artifact instead of a temporary workflow file.
#
# Prerequisites (one-time, manual — see docs/DAY_6_COMPLETION.md):
#   1. An orphan `gh-pages` branch must exist.
#   2. GitHub Pages must be enabled for this repo (Settings -> Pages ->
#      Deploy from a branch -> gh-pages / root).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  publish:
    name: Build & Publish Index
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build dumb-pypi

      - name: Build package (sdist + wheel)
        run: python -m build

      - name: Checkout index branch (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Add packages and regenerate index
        run: |
          mkdir -p site/packages
          cp dist/* site/packages/
          ls site/packages > package-list.txt
          dumb-pypi \
            --package-list package-list.txt \
            --packages-url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/packages/ \
            --output-dir site

      - name: Commit & push index
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish ${{ github.ref_name }}"
          git push

      - name: Upload dist as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: techstyle-published-dist
          path: dist/*
