name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write      # nötig für den SARIF-Upload

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: snyk/actions/setup@master

      - name: SCA – Abhängigkeiten
        run: snyk test --severity-threshold=high --sarif-file-output=snyk-sca.sarif

      - name: SAST – Quellcode
        if: always()
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif

      - name: SARIF hochladen (SCA)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-sca

      - name: SARIF hochladen (SAST)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
